[workspace]
resolver = "2"
members = [
    "crates/frp-core",
    "crates/frp-server",
    "crates/frp-client",
    "crates/frp-cli",
]

[workspace.package]
version = "0.71.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/david88558855/Rust-Frp"
homepage = "https://github.com/david88558855/Rust-Frp"
description = "A Rust reimplementation of frp (fast reverse proxy), wire compatible with frp v0.71"
authors = ["david88558855"]

[workspace.dependencies]
frp-core = { path = "crates/frp-core", version = "0.71.0" }
frp-server = { path = "crates/frp-server", version = "0.71.0" }
frp-client = { path = "crates/frp-client", version = "0.71.0" }

# async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io", "compat"] }
futures-util = "0.3"

# serde / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"

# cli / logging
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }

# misc
anyhow = "1"
thiserror = "2"
bytes = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
md-5 = "0.10"

# crypto
aes = "0.8"
cipher = "0.4"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"

# compression
snap = "1"
crc32c = "0.6"

# tls
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
webpki-roots = "0.26"

# http stack (dashboard / admin api / vhost)
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
tower = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
