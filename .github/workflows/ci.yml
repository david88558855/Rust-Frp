name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets
      # Per-crate invocations with a hard timeout and serial execution: a hung
      # test would otherwise stall the job, and `--nocapture --test-threads=1`
      # makes libtest print each test as it starts, so the step log names the
      # culprit directly.
      - name: cargo test (frp-core)
        run: timeout -k 10 300 cargo test -p frp-core -- --nocapture --test-threads=1
      - name: cargo test (frp-client)
        run: timeout -k 10 300 cargo test -p frp-client -- --nocapture --test-threads=1
      - name: cargo test (frp-server)
        run: timeout -k 10 300 cargo test -p frp-server -- --nocapture --test-threads=1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rust-frp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rust-frp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rust-frp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-frp-${{ matrix.target }}
          path: |
            target/release/${{ matrix.bin }}
          if-no-files-found: warn
