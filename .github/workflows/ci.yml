name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A superseded run has no value once a newer commit is on the same ref: cancel
# it so the fleet is spent on the tip. Pull requests cancel per head branch so
# force-pushes do not leave a queue behind either.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflows only read the repository. `actions: read` is what lets the job
# listing endpoints work; nothing here needs write access to contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: cargo check + test
    runs-on: ubuntu-latest
    # Generous ceiling: the whole job runs in about a minute, so anything near
    # this means a hung test or a wedged runner rather than slow work.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --workspace --all-targets
      # Per-crate invocations with a hard timeout and serial execution: a hung
      # test would otherwise stall the job, and `--nocapture --test-threads=1`
      # makes libtest print each test as it starts, so the step log names the
      # culprit directly.
      - name: cargo test (frp-core)
        run: timeout -k 10 300 cargo test -p frp-core -- --nocapture --test-threads=1
      - name: cargo test (frp-client)
        run: timeout -k 10 300 cargo test -p frp-client -- --nocapture --test-threads=1
      - name: cargo test (frp-server)
        run: timeout -k 10 300 cargo test -p frp-server -- --nocapture --test-threads=1
      - name: cargo test (frp-cli)
        run: timeout -k 10 300 cargo test -p frp-cli -- --nocapture --test-threads=1
      # The wire conformance corpus is an integration test of frp-core, so it
      # lives outside the per crate loop above and is run explicitly.
      - name: cargo test (frp-core wire vectors)
        run: timeout -k 10 300 cargo test -p frp-core --test wire_vectors -- --nocapture

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rust-frp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rust-frp.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rust-frp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-frp-${{ matrix.target }}
          path: |
            target/release/${{ matrix.bin }}
          if-no-files-found: warn

  # Runs frps and frpc against each other over real sockets. Unit tests cannot
  # catch a peer protocol mismatch: the visitor signature check used to compile,
  # pass every test, and still reject every visitor connection.
  e2e:
    name: end to end
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Run the e2e suite
        run: python3 tests/e2e/e2e.py target/release/rust-frp

  # The differential layer, and the only one that can catch a mistake both ends
  # share. The crypto module derived its AES key with the wrong salt for the
  # whole of milestone 1: every unit test passed, the e2e suite passed, and the
  # two peers talked to each other perfectly -- because they were wrong in the
  # same way. Running against a real frp release is what found it.
  interop:
    name: differential vs frp 0.71.0
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace
      - name: Fetch the reference implementation
        run: |
          curl -fsSL -o frp.tar.gz \
            https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_linux_amd64.tar.gz
          tar xzf frp.tar.gz
          ./frp_0.71.0_linux_amd64/frps --version
      - name: Wire protocol interoperability
        run: |
          python3 tests/interop/interop.py \
            --rust target/release/rust-frp \
            --upstream frp_0.71.0_linux_amd64 \
            --with-visitors
      - name: Client plugin interoperability
        run: |
          python3 tests/interop/plugins.py \
            --rust target/release/rust-frp \
            --upstream frp_0.71.0_linux_amd64
      - name: Admin API interoperability
        run: |
          python3 tests/interop/admin_api.py \
            --rust target/release/rust-frp \
            --upstream frp_0.71.0_linux_amd64

  # The layer beneath interop. Where the differential job proves the two peers
  # can talk, this one pins the exact bytes each control message encodes to,
  # by regenerating the corpus with frp's own encoder and diffing.
  #
  # It catches the class of mistake neither the unit tests nor the e2e suite
  # can see: a field name, an ordering or an omitempty decision that is
  # self-consistent and therefore invisible until it meets Go.
  wire-vectors:
    name: wire conformance vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      # A cold `go mod download` of frp and its dependency tree is the slowest
      # step in this job, so it is cached across runs. The key hashes the
      # generator's go.mod, which pins frp and golib; there is deliberately no
      # go.sum here, because `go mod tidy` writes one into a temp dir rather
      # than the repo.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-govec-${{ hashFiles('tests/interop/vectors/gen_go_vectors/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-govec-
      - name: The Rust encoder reproduces every vector
        run: cargo test -p frp-core --test wire_vectors -- --nocapture
      - name: Fetch the reference implementation
        run: |
          curl -fsSL -o frp.tar.gz \
            https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_linux_amd64.tar.gz
          tar xzf frp.tar.gz
      - name: The corpus still matches frp 0.71.0
        run: python3 tests/interop/vectors/verify_vectors.py --upstream frp_0.71.0_linux_amd64
      - name: Regenerate the corpus from frp and diff
        run: python3 tests/interop/vectors/regenerate.py --check
