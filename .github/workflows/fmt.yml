name: Format

# Formatting is a hard gate. The tree is canonical as of the `style: apply
# cargo fmt` commit, so a diff here means a patch drifted rather than that the
# check is noisy.
#
# The repository still has no local Rust toolchain, but that is no longer a
# reason to tolerate drift: the "Apply rustfmt" workflow runs the same
# `cargo fmt --all` on the runner and commits the result, so a failure here has
# a one click remedy. Run it from the Actions tab, then pull.
#
# `workflow_dispatch` with `apply: false` keeps the original report-only mode
# for the case where the diff itself is what you want to read.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      apply:
        description: "Report the diff without failing the job"
        type: boolean
        default: false

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        id: check
        # Only a manual run may downgrade this to a report.
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: cargo fmt --all -- --check
      - name: Publish the diff to the summary
        if: always()
        run: |
          {
            echo "### rustfmt"
            echo
            if [ "${{ steps.check.outcome }}" = "success" ]; then
              echo "The tree is canonical; \`cargo fmt --all\` would change nothing."
            else
              echo "The tree is **not canonical**."
              echo
              echo "Run the **Apply rustfmt** workflow to commit the canonical form,"
              echo "then pull. The diff it would apply:"
              echo
              echo '```'
              cargo fmt --all
              git --no-pager diff --stat
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show the diff
        if: always()
        run: |
          cargo fmt --all
          git --no-pager diff --stat
          git --no-pager diff
