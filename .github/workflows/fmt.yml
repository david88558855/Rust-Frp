name: Format

# Formatting is enforced separately from CI on purpose: the repository is
# developed without a local Rust toolchain, so patches are written by hand and
# reviewed for style rather than being reformatted on every push. Run this
# workflow to get a canonical `cargo fmt` diff (or to apply it locally) before a
# release.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Print the rustfmt diff instead of failing fast"
        type: boolean
        default: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: ${{ inputs.apply }}
      - name: Show the diff to apply
        if: always()
        run: |
          cargo fmt --all
          git --no-pager diff --stat
          git --no-pager diff
